name: Atualizar EPG

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Juntar EPGs
        run: python3 merge_epg.py
      - name: Publicar
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add guide.xml.gz
          git commit -m "EPG $(date -u +%F\ %H:%M)" || echo "sem mudanças"
          git push
